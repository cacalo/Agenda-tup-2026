<h1>Mis contactos</h1>


@for (contacto of contactsService.contactList; track $index) {
    <div>
        <a [routerLink]="['/contacts',contacto.id]">
            <span>
                <img src="" alt="Foto del contacto">
            </span>
            <span>
                Nombre: {{contacto.nombre}}
            </span>
            <span>
                Teléfono: {{contacto.numeroTelefono}}
            </span>
            <span>
                Dirección: {{contacto.direccion}}
            </span>
        </a>
    </div>
}


<button (click)="contactsService.agregarAlumno( )" [disabled]="contactsService.contactList.length>5">Agregar contacto</button>
