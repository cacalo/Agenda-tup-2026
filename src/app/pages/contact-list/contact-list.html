<header>
  <h1>Mis contactos</h1>
  <button>Cerrar sesión</button>
</header>
<main>
  @for (contacto of contactsService.contactList; track $index) {
  <div class="contacto card">
    <a [routerLink]="['/contacts',contacto.Id]">
      <span>
        <img src="img/person.png" alt="Foto del contacto" width="50px">
      </span>
      <span>
        {{contacto.FirstName}} {{contacto.LastName}}
      </span>
      <span>
        {{contacto.Number}}
      </span>
    </a>
    <div>
      <a class="button" [routerLink]="['/contacts',contacto.Id,'edit']">Editar</a>
      <button (click)="eliminarContacto(contacto.Id)">Eliminar</button>
    </div>
  </div>
  }
  <a class="fab" routerLink="/contacts/create">+</a>
</main>
